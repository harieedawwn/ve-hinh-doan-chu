<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<script>
  // Zalo's WebView calls its own bridge on every page; stub it so its injected code never throws into ours.
  try { if (!window.zaloJSV2) window.zaloJSV2 = { zalo_h5_event_handler: function () {}, getCookieFallback: function () { return ''; } }; } catch (e) {}
  // apply the saved theme before first paint (no flash)
  try { var p = JSON.parse(localStorage.getItem('vhdc:prefs') || '{}'); var t = p.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.dataset.theme = t; } catch (e) {}
</script>
